<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Open to internships and collaborations in software development, full-stack and AI-enabled applications" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2A2A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="110" rx="16"/></clipPath>
    <style>
      .h { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #F1F5F9; }
      .s { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #94A3B8; }
      .b { font: 700 13px 'Segoe UI', Arial, sans-serif; fill: #0B1220; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="900" height="110" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <rect y="0" width="300" height="110" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="899" height="109" rx="16" fill="none" stroke="#10B981" stroke-opacity="0.35"/>

  <circle cx="48" cy="55" r="6" fill="#34D399"/>
  <circle cx="48" cy="55" r="6" fill="none" stroke="#34D399" stroke-width="2">
    <animate attributeName="r" values="6;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text x="80" y="50" class="h">Open to internships and collaborations</text>
  <text x="80" y="76" class="s">Software development · Full-stack · AI-enabled applications</text>

  <rect x="708" y="35" width="152" height="40" rx="20" fill="#34D399"/>
  <text x="784" y="60" text-anchor="middle" class="b">LET'S CONNECT</text>
</svg>