<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Kamesh S. - Engineering student, technology builder, aspiring entrepreneur" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F2A2A"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399">
        <animate attributeName="stop-color" values="#34D399;#22D3EE;#34D399" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#34D399;#22D3EE" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name { font: 800 58px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .role { font: 500 22px 'Courier New', monospace; fill: #CBD5E1; }
      .sub  { font: 400 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #64748B; letter-spacing: 3px; }
    </style>
  </defs>
  <rect width="900" height="240" rx="14" fill="url(#bg)"/>
  
