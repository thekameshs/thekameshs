<svg xmlns="http://www.w3.org/2000/svg" width="420" height="152" viewBox="0 0 420 152" role="img" aria-labelledby="title description">
  <title id="title">LeetCode progress: 122 problems solved</title>
  <desc id="description">A static LeetCode progress card showing 122 problems solved and data structures and algorithms practice.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFA116"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="418" height="150" rx="14" fill="url(#background)" stroke="#30363D" stroke-width="1.5"/>
  <rect x="1" y="1" width="5" height="150" rx="2.5" fill="url(#accent)"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="26" y="34" fill="#FFA116" font-size="13" font-weight="700" letter-spacing="2">LEETCODE</text>
    <text x="393" y="34" fill="#8B949E" font-size="11" text-anchor="end" letter-spacing="1">PROFILE</text>

    <text x="25" y="105" fill="#F0F6FC" font-size="57" font-weight="750" letter-spacing="-2">122</text>
    <text x="154" y="79" fill="#F0F6FC" font-size="17" font-weight="700">PROBLEMS</text>
    <text x="154" y="102" fill="#F0F6FC" font-size="17" font-weight="700">SOLVED</text>

    <line x1="154" y1="116" x2="392" y2="116" stroke="#30363D"/>
    <text x="154" y="134" fill="#8B949E" font-size="11.5">Data Structures &amp; Algorithms practice</text>
  </g>
</svg>
